# Guncelleme gonder: GitHub'in Windows makinesinde build/publish.py calisir
# (kilitli kurulum + acik taramasi + testler -> EXE + kurulum derle -> selftest -> release).
# Baslatan: ~/tools/yayin/gonder.py (Mac ya da Windows). Elle: Actions > yayin > Run workflow.
name: yayin
on:
  workflow_dispatch:
    inputs:
      surum:
        description: "Yeni surum (or. 0.4.3)"
        required: true
      notlar:
        description: "Ne degisti"
        required: false
        default: ""
      deneme:
        description: "Yalniz derle + selftest, yayinlama"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: yayin
jobs:
  yayin:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Acik tarayici (~/tools/tedarik, kilitli)
        shell: pwsh
        run: |
          $t = Join-Path $env:USERPROFILE "tools\tedarik"
          python -m venv $t
          & "$t\Scripts\python.exe" -m pip install -q --require-hashes --no-deps -r build/ci/tedarik.txt
          if ($LASTEXITCODE) { exit 1 }
          Copy-Item build/ci/tara.py "$t\tara.py"
      - name: Kilitli ortam (build/venv)
        shell: pwsh
        run: |
          # publish.py launcher'i import ediyor; paketler sistem Python'unda degil, kilitli venv'de
          python -m venv build/venv
          & build/venv/Scripts/python.exe -m pip install -q --require-hashes --no-deps -r requirements.txt
          exit $LASTEXITCODE
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Lisans anahtari
        shell: pwsh
        env:
          S: ${{ secrets.LICENSE_SECRET }}
        run: |
          if (-not $env:S) { Write-Error "LICENSE_SECRET yok"; exit 1 }
          [IO.File]::WriteAllText("license_secret.txt", $env:S)
      - name: Yayinla
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          SURUM: ${{ inputs.surum }}
          NOTLAR: ${{ inputs.notlar }}
          DENEME: ${{ inputs.deneme }}
        run: |
          git config user.name "yayin-bot"
          git config user.email "yayin-bot@users.noreply.github.com"
          $ek = @()
          if ($env:DENEME -eq "true") { $ek += "--deneme" }
          & build/venv/Scripts/python.exe build/publish.py $env:SURUM $env:NOTLAR @ek
          exit $LASTEXITCODE
